<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090914">
<title>ELYO</title>

<style>
:root{
  --bg:#090914;
  --purple:#a78bfa;
  --blue:#78d9ff;
  --text:#f7f4ff;
  --muted:#9691aa;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;height:100dvh;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#292044 0%,#111020 42%,#090914 80%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,textarea{font:inherit}
button{cursor:pointer}
.app{
  height:100dvh;max-width:1050px;margin:auto;
  display:flex;flex-direction:column;
}
header{
  height:58px;flex-shrink:0;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.logo{
  font-size:21px;font-weight:800;letter-spacing:5px;
  background:linear-gradient(100deg,#fff,#b6a1ff,#79d9ff);
  color:transparent;background-clip:text;
}
.header-right{display:flex;align-items:center;gap:8px}
.status{font-size:11px;color:var(--muted)}
.dot{
  display:inline-block;width:7px;height:7px;margin-right:6px;
  background:#7be4b4;border-radius:50%;box-shadow:0 0 10px #7be4b4;
}
.icon-btn{
  background:#ffffff09;border:1px solid var(--line);
  color:#ddd8ee;border-radius:12px;padding:9px 12px;
}

/* CONVERSATION */
.chat{
  flex:1;min-height:0;overflow-y:auto;
  padding:28px 20px 35px;scroll-behavior:smooth;
}
.messages{
  width:min(760px,100%);margin:auto;
  display:flex;flex-direction:column;gap:28px;
}
.message-row{
  display:flex;align-items:flex-start;gap:12px;width:100%;
}
.message-row.user{justify-content:flex-end}
.message{
  max-width:min(82%,650px);
  font-size:15px;line-height:1.75;
  overflow-wrap:anywhere;white-space:pre-wrap;
}
.message.user{
  background:linear-gradient(125deg,#7556ca,#4e75bb);
  padding:12px 17px;border-radius:19px 19px 5px 19px;
  color:white;
}
.message.ai{
  padding:3px 0 0;color:#f0edf8;
  flex:1;min-width:0;
}
.message-label{
  display:block;color:#bba9ff;font-size:10px;
  letter-spacing:1.6px;margin-bottom:5px;font-weight:700;
}

/* ELYO ORB */
.avatar{
  flex:0 0 43px;width:43px;height:43px;
  position:relative;display:grid;place-items:center;
  margin-top:1px;
}
.halo{
  position:absolute;width:49px;height:49px;border-radius:50%;
  background:radial-gradient(circle,#a88aff70,transparent 70%);
  filter:blur(7px);animation:halo 4s ease-in-out infinite;
}
.orb{
  width:36px;height:36px;position:relative;z-index:1;
  border-radius:48% 52% 53% 47% / 48% 44% 56% 52%;
  background:
    radial-gradient(ellipse at 28% 19%,#fff 0%,#e5dcff 4%,transparent 20%),
    radial-gradient(ellipse at 75% 75%,#267acb 0%,transparent 43%),
    radial-gradient(ellipse at 27% 75%,#a66cff 0%,transparent 52%),
    linear-gradient(140deg,#d8cbff,#9a78f3 43%,#4d9ce9 78%,#a4eaff);
  box-shadow:
    inset -6px -7px 12px #17216d55,
    inset 5px 5px 9px #ffffffa0,
    0 0 19px #9274ff75;
  animation:float 5s ease-in-out infinite,morph 9s ease-in-out infinite;
}
.orb:before{
  content:"";position:absolute;inset:2px;border-radius:inherit;
  border:1px solid #ffffff75;
  background:linear-gradient(140deg,#ffffff65,transparent 45%);
}
.face{
  position:absolute;z-index:2;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;padding-top:2px;
}
.eyes{display:flex;gap:7px}
.eye{
  width:3px;height:5px;background:#30264f;border-radius:50%;
  animation:blink 5s infinite;
  transition:all .25s ease;
}
.mouth{
  width:6px;height:3px;
  border-bottom:1.3px solid #30264f;border-radius:50%;
  transition:all .25s ease;
}

/* EXPRESSION : HEUREUX */
.emotion-happy .eye{
  height:3px;
  border-radius:50% 50% 0 0;
  transform:scaleY(.7);
}
.emotion-happy .mouth{
  width:10px;height:5px;
  border-bottom:2px solid #30264f;
}

/* EXPRESSION : CURIEUX */
.emotion-curious .eye{
  width:4px;height:6px;
}
.emotion-curious .mouth{
  width:5px;height:5px;
  border:1.4px solid #30264f;
  border-radius:50%;
}

/* EXPRESSION : CONCENTRÉ */
.emotion-focused .eye{
  width:4px;height:3px;
  border-radius:2px;
}
.emotion-focused .mouth{
  width:5px;height:2px;
  border-bottom:1.5px solid #30264f;
}

/* EXPRESSION : SURPRIS */
.emotion-surprised .eye{
  width:4px;height:7px;
}
.emotion-surprised .mouth{
  width:5px;height:7px;
  border:1.4px solid #30264f;
  border-radius:50%;
}

/* EXPRESSION : APAISÉ */
.emotion-calm .eye{
  height:2px;width:4px;
  border-radius:50% 50% 0 0;
}
.emotion-calm .mouth{
  width:7px;height:3px;
  border-bottom:1.3px solid #30264f;
}

/* EXPRESSION : PARLANT */
.emotion-talking .mouth{
  width:7px;height:6px;
  border:1.5px solid #30264f;
  background:#30264f;
  border-radius:50%;
  animation:mouthTalk .3s ease-in-out infinite alternate;
}

.message-row.thinking .orb{
  animation:think 1.5s ease-in-out infinite,morph 5s infinite;
}
.message-row.thinking .halo{
  animation:halo 1s ease-in-out infinite;
}
.message-row.talking .orb{
  animation:talk .7s ease-in-out infinite,morph 4s infinite;
}
.typing-text{
  color:#aaa4bd;font-size:13px;
  animation:pulse 1.3s infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-4px) rotate(4deg)}
}
@keyframes morph{
  0%,100%{border-radius:48% 52% 53% 47% / 48% 44% 56% 52%}
  50%{border-radius:55% 45% 46% 54% / 43% 55% 45% 57%}
}
@keyframes halo{
  0%,100%{transform:scale(.9);opacity:.7}
  50%{transform:scale(1.12);opacity:1}
}
@keyframes blink{
  0%,45%,49%,100%{transform:scaleY(1)}
  47%{transform:scaleY(.12)}
}
@keyframes think{
  0%,100%{transform:scale(1) rotate(-3deg)}
  50%{transform:scale(1.12) rotate(5deg)}
}
@keyframes talk{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08,.95)}
}
@keyframes mouthTalk{
  from{transform:scaleY(.7)}
  to{transform:scaleY(1.3)}
}
@keyframes pulse{50%{opacity:.4}}

/* INPUT */
.composer-wrap{
  flex-shrink:0;padding:12px 16px max(13px,env(safe-area-inset-bottom));
  background:linear-gradient(transparent,#090914 20%);
}
.composer{width:min(760px,100%);margin:auto;position:relative}
.input-shell{
  display:flex;align-items:flex-end;gap:10px;padding:9px;
  border-radius:21px;border:1px solid #a68aff55;
  background:rgba(23,21,42,.96);backdrop-filter:blur(20px);
  box-shadow:0 10px 40px #0007,0 0 28px #9575ff12;
}
.plus,.send{
  width:43px;height:43px;flex-shrink:0;
  border-radius:14px;display:grid;place-items:center;
}
.plus{
  font-size:25px;color:white;background:#ffffff0c;
  border:1px solid #ffffff20;transition:.25s;
}
.plus.open{transform:rotate(45deg);background:#8e70ee}
.send{
  border:0;background:linear-gradient(135deg,#a98aff,#5d9eea);
  color:white;font-size:20px;
}
.send:disabled{opacity:.45}
textarea{
  flex:1;min-width:0;max-height:125px;min-height:43px;
  resize:none;border:0;outline:0;background:transparent;
  color:white;padding:12px 3px;font-size:15px;
}
textarea::placeholder{color:#8e89a4}
.note{text-align:center;color:#77718d;font-size:10px;margin-top:8px}

/* MENU AND HISTORY */
.menu{
  display:none;position:absolute;bottom:75px;left:0;
  width:min(310px,90vw);padding:9px;
  border:1px solid #ffffff1b;border-radius:17px;
  background:#171529f5;backdrop-filter:blur(24px);
  box-shadow:0 15px 50px #0009;z-index:5;
}
.menu.show{display:block}
.menu button{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px;border:0;border-radius:11px;
  background:transparent;color:#eee9fa;
  text-align:left;font-size:13px;
}
.menu button:hover{background:#ffffff12}
.menu button span{font-size:18px;width:22px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px}
#fileInput{display:none}
.history-panel{
  position:fixed;inset:0;z-index:20;background:#05050bcc;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.history-panel.show{display:flex}
.history-box{
  width:min(420px,100%);max-height:70vh;overflow:auto;
  padding:22px;border:1px solid var(--line);
  border-radius:20px;background:#171529;
}
.history-box h2{font-size:18px}
.history-entry{
  padding:12px 0;border-bottom:1px solid var(--line);
  font-size:13px;color:#d8d2e8;
}
.history-actions{display:flex;gap:8px;margin-top:18px}
.history-actions button{
  flex:1;padding:11px;border-radius:10px;
  border:1px solid var(--line);background:#ffffff0b;color:white;
}
@media(max-width:600px){
  header{padding:0 15px}
  .chat{padding:22px 15px 25px}
  .messages{gap:24px}
  .message{font-size:15px;max-width:88%}
  .avatar{flex-basis:39px;width:39px;height:39px}
  .orb{width:34px;height:34px}
  .composer-wrap{padding:10px 12px max(10px,env(safe-area-inset-bottom))}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">ELYO</div>
  <div class="header-right">
    <span class="status"><span class="dot"></span>À tes côtés</span>
    <button class="icon-btn" onclick="openHistory()" aria-label="Historique">◷</button>
  </div>
</header>

<main class="chat" id="chat">
  <div class="messages" id="messages"></div>
</main>

<div class="composer-wrap">
  <div class="composer">

    <div class="menu" id="menu">
      <button onclick="promptText('Aide-moi à lancer une entreprise et construire un plan concret.')"><span>◈</span>Lancer un business</button>
      <button onclick="promptText('Aide-moi à créer une application de A à Z.')"><span>▣</span>Créer une application</button>
      <button onclick="promptText('Aide-moi à atteindre un objectif avec un plan étape par étape.')"><span>◎</span>Atteindre un objectif</button>
      <button onclick="promptText('Explorons des idées originales et ambitieuses.')"><span>✧</span>Explorer des idées</button>
      <hr>
      <button onclick="document.getElementById('fileInput').click()"><span>📎</span>Ajouter un fichier texte</button>
      <button onclick="toggleAdvanced()"><span>⌘</span><span id="advancedText">Mode avancé : désactivé</span></button>
      <button onclick="showHistory()"><span>◷</span>Historique</button>
    </div>

    <div class="input-shell">
      <button class="plus" id="plus" aria-label="Ouvrir les outils">+</button>
      <textarea id="input" rows="1" placeholder="Écris à ELYO..."></textarea>
      <button class="send" id="send" aria-label="Envoyer">↑</button>
    </div>
    <div class="note">ELYO est là pour avancer avec toi.</div>
  </div>
  <input type="file" id="fileInput" accept=".txt,.md,.csv,.json">
</div>
</div>

<div class="history-panel" id="historyPanel">
  <div class="history-box">
    <h2>Nos conversations</h2>
    <div id="historyList"></div>
    <div class="history-actions">
      <button onclick="closeHistory()">Fermer</button>
      <button onclick="clearHistory()">Effacer</button>
    </div>
  </div>
</div>

<script>
const API_URL="https://do-it-api.youssef-norzamane.workers.dev/";
const KEY="elyo_history_v3";

const messagesBox=document.getElementById("messages");
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendButton=document.getElementById("send");
const menu=document.getElementById("menu");
const plus=document.getElementById("plus");

let history=[];
let advanced=false;
let fileContent="";

/* CRÉATION DE LA SPHÈRE */
function makeAvatar(expression="calm"){
  const avatar=document.createElement("div");
  avatar.className="avatar emotion-"+expression;
  avatar.innerHTML=`
    <div class="halo"></div>
    <div class="orb">
      <div class="face">
        <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
        <div class="mouth"></div>
      </div>
    </div>`;
  return avatar;
}

function setExpression(row,expression){
  const avatar=row.querySelector(".avatar");
  if(!avatar)return;

  avatar.className="avatar emotion-"+expression;
}

/* PREMIÈRE DÉTECTION CONTEXTUELLE */
function detectEmotion(userText,answer){
  const text=(userText+" "+answer)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

  const contains=words=>words.some(word=>text.includes(word));

  if(contains([
    "je suis triste","je vais mal","je suis stresse",
    "j'ai peur","je suis inquiet","je suis fatigue",
    "je suis decu","c'est difficile","ca ne va pas"
  ])){
    return "calm";
  }

  if(contains([
    "surprise","incroyable","impressionnant",
    "je n'en reviens pas","wow","oh la la"
  ]) || /!{2,}/.test(text)){
    return "surprised";
  }

  if(contains([
    "bravo","felicitations","excellent",
    "genial","super nouvelle","je suis content",
    "trop bien","bien joue","magnifique"
  ])){
    return "happy";
  }

  if(userText.includes("?") || contains([
    "pourquoi","comment","est-ce que",
    "explique-moi","je me demande"
  ])){
    return "curious";
  }

  if(contains([
    "plan","projet","objectif","etape",
    "code","developpement","travail",
    "organiser","construire","solution"
  ])){
    return "focused";
  }

  return "calm";
}

function scrollChat(){
  requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight;});
}

function displayMessage(role,text,expression){
  const row=document.createElement("div");
  row.className="message-row "+role;

  if(role==="ai"){
    const emotion=expression||"calm";
    row.appendChild(makeAvatar(emotion));

    const bubble=document.createElement("div");
    bubble.className="message ai";

    const label=document.createElement("span");
    label.className="message-label";
    label.textContent="ELYO";

    const content=document.createElement("div");
    content.textContent=text;

    bubble.append(label,content);
    row.appendChild(bubble);
  }else{
    const bubble=document.createElement("div");
    bubble.className="message user";
    bubble.textContent=text;
    row.appendChild(bubble);
  }

  messagesBox.appendChild(row);
  scrollChat();
  return row;
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(history));}
  catch(e){console.warn("Sauvegarde impossible",e);}
}

function addMessage(role,text){
  const expression=role==="ai"?"calm":undefined;
  history.push({role,text,expression});
  save();
  displayMessage(role,text,expression);
}

function restore(){
  try{
    const stored=JSON.parse(localStorage.getItem(KEY)||"[]");
    if(Array.isArray(stored))history=stored;
  }catch(e){history=[];}

  if(history.length){
    history.forEach(m=>displayMessage(m.role,m.text,m.expression));
  }else{
    displayMessage("ai","Salut ! Je suis là. On fait quoi aujourd'hui ?","happy");
  }
}

function resizeInput(){
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,125)+"px";
}

function promptText(text){
  input.value=text;
  closeMenu();
  input.focus();
  resizeInput();
}

function closeMenu(){
  menu.classList.remove("show");
  plus.classList.remove("open");
}

plus.addEventListener("click",()=>{
  menu.classList.toggle("show");
  plus.classList.toggle("open");
});

document.addEventListener("click",e=>{
  if(!menu.contains(e.target)&&!plus.contains(e.target))closeMenu();
});

input.addEventListener("input",resizeInput);

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function toggleAdvanced(){
  advanced=!advanced;
  document.getElementById("advancedText").textContent=
    "Mode avancé : "+(advanced?"activé":"désactivé");
  closeMenu();
  addMessage("ai",advanced?
    "Le mode avancé est activé. Tu peux me confier des demandes plus techniques et détaillées.":
    "Le mode avancé est désactivé.");
}

document.getElementById("fileInput").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;

  if(file.size>1024*1024){
    addMessage("ai","Le fichier dépasse 1 Mo. Essaie avec un fichier plus léger.");
  }else{
    fileContent=await file.text();
    input.value="Analyse le fichier que je viens d'ajouter : "+file.name;
    resizeInput();
    input.focus();
  }
  e.target.value="";
  closeMenu();
});

async function sendMessage(){
  let text=input.value.trim();
  if(!text||sendButton.disabled)return;

  if(fileContent){
    text+="\n\nContenu du fichier :\n"+fileContent;
    fileContent="";
  }

  addMessage("user",text);
  input.value="";
  resizeInput();
  closeMenu();

  sendButton.disabled=true;

  /* ELYO RÉFLÉCHIT */
  const typingRow=document.createElement("div");
  typingRow.className="message-row ai thinking";
  typingRow.appendChild(makeAvatar("focused"));

  const typingBubble=document.createElement("div");
  typingBubble.className="message ai";

  const typingLabel=document.createElement("span");
  typingLabel.className="message-label";
  typingLabel.textContent="ELYO";

  const typingText=document.createElement("div");
  typingText.className="typing-text";
  typingText.textContent="Je réfléchis...";

  typingBubble.append(typingLabel,typingText);
  typingRow.appendChild(typingBubble);
  messagesBox.appendChild(typingRow);
  scrollChat();

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),16000);

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text}),
      signal:controller.signal
    });

    const data=await response.json();
    typingRow.remove();

    if(!response.ok)throw new Error(data.error||"Erreur du serveur");

    const answer=data.answer||data.response||data.text||"Je n'ai pas reçu de réponse.";

    /* ELYO CHOISIT SON EXPRESSION */
    const expression=detectEmotion(text,answer);

    const answerRow=displayMessage("ai",answer,expression);

    /* ANIMATION PENDANT LA RÉPONSE */
    answerRow.classList.add("talking");
    setExpression(answerRow,"talking");

    setTimeout(()=>{
      answerRow.classList.remove("talking");
      setExpression(answerRow,expression);
    },1800);

    history.push({
      role:"ai",
      text:answer,
      expression:expression
    });
    save();

  }catch(error){
    typingRow.remove();

    const message=error.name==="AbortError"
      ?"La réponse prend trop de temps. Réessaie dans quelques instants."
      :"Je rencontre un problème de connexion. Réessaie dans quelques instants.";

    addMessage("ai",message);

  }finally{
    clearTimeout(timer);
    sendButton.disabled=false;
    input.focus();
  }
}

sendButton.addEventListener("click",sendMessage);

function openHistory(){
  const panel=document.getElementById("historyPanel");
  const list=document.getElementById("historyList");
  list.innerHTML="";

  if(!history.length){
    list.textContent="Aucune conversation pour le moment.";
  }else{
    history.slice().reverse().forEach(m=>{
      const item=document.createElement("div");
      item.className="history-entry";
      item.textContent=(m.role==="user"?"Toi : ":"ELYO : ")+m.text;
      list.appendChild(item);
    });
  }
  panel.classList.add("show");
}

function showHistory(){
  closeMenu();
  openHistory();
}

function closeHistory(){
  document.getElementById("historyPanel").classList.remove("show");
}

function clearHistory(){
  if(confirm("Effacer l'historique enregistré sur cet appareil ?")){
    history=[];
    save();
    messagesBox.innerHTML="";
    displayMessage("ai","Salut ! Je suis là. On fait quoi aujourd'hui ?","happy");
    closeHistory();
  }
}

restore();
</script>
</body>
</html>
